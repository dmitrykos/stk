<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="100%" height="100%">
  <defs>
    <!-- Drop shadow filter matching the soft shadow in the PNG -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g fill="#00FF00" filter="url(#shadow)">
    <!-- Central Die (adjusted proportionally to the rectangular body) -->
    <rect x="86" y="78" width="48" height="44" rx="8" />

    <!-- Outer Chip Body with Inner Cutout (Rectangular: wider top/bottom than left/right) -->
    <path fill-rule="evenodd" d="
      M 50,65 
      C 50,56.7157 56.7157,50 65,50 
      H 155 
      C 163.284,50 170,56.7157 170,65 
      V 135 
      C 170,143.284 163.284,150 155,150 
      H 65 
      C 56.7157,150 50,143.284 50,135 
      Z
      M 68,68
      H 152
      V 132
      H 68
      Z" />

    <!-- Top Pins (3) - Spaced across the wider top edge -->
    <rect x="73" y="30" width="6" height="23" rx="1" />
    <rect x="69" y="26" width="14" height="10" rx="2" />

    <rect x="107" y="30" width="6" height="23" rx="1" />
    <rect x="103" y="26" width="14" height="10" rx="2" />

    <rect x="141" y="30" width="6" height="23" rx="1" />
    <rect x="137" y="26" width="14" height="10" rx="2" />

    <!-- Bottom Pins (3) - Spaced across the wider bottom edge -->
    <rect x="73" y="147" width="6" height="23" rx="1" />
    <rect x="69" y="164" width="14" height="10" rx="2" />

    <rect x="107" y="147" width="6" height="23" rx="1" />
    <rect x="103" y="164" width="14" height="10" rx="2" />

    <rect x="141" y="147" width="6" height="23" rx="1" />
    <rect x="137" y="164" width="14" height="10" rx="2" />

    <!-- Left Pins (2) -->
    <rect x="28" y="77" width="23" height="6" rx="1" />
    <rect x="24" y="73" width="10" height="14" rx="2" />

    <rect x="28" y="117" width="23" height="6" rx="1" />
    <rect x="24" y="113" width="10" height="14" rx="2" />

    <!-- Right Pins (2) -->
    <rect x="169" y="77" width="23" height="6" rx="1" />
    <rect x="186" y="73" width="10" height="14" rx="2" />

    <rect x="169" y="117" width="23" height="6" rx="1" />
    <rect x="186" y="113" width="10" height="14" rx="2" />
  </g>
</svg>